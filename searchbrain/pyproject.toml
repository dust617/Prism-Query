[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchbrain"
version = "0.1.0"
description = "面向 AI Agent 的智能搜索中间层（初版）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp>=3"]

[tool.setuptools.packages.find]
include = ["searchbrain*"]